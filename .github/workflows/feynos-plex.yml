          package com.feynos.plex

          import org.json.JSONArray
          import org.json.JSONObject

          fun JSONObject.s(k: String): String? = if (has(k) && !isNull(k)) optString(k).takeIf { it.isNotEmpty() } else null
          fun JSONArray?.objs(): List<JSONObject> = if (this == null) emptyList() else (0 until length()).mapNotNull { optJSONObject(it) }
          fun JSONObject.tags(k: String): List<String> = optJSONArray(k).objs().mapNotNull { it.s("tag") }
          fun JSONObject.metadata(): List<Item> = optJSONArray("Metadata").objs().map { Item.parse(it) }
          fun JSONObject.hubs(): List<Hub> = optJSONArray("Hub").objs().map { Hub.parse(it) }

          data class Stream(
              val id: Long,
              val type: Int,
              val title: String,
              val language: String?,
              val codec: String?,
              val key: String?,
              val selected: Boolean,
              val forced: Boolean,
          ) {
              companion object {
                  fun parse(o: JSONObject) = Stream(
                      id = o.optLong("id"),
                      type = o.optInt("streamType"),
                      title = o.s("extendedDisplayTitle") ?: o.s("displayTitle") ?: o.s("title") ?: o.s("language") ?: "Track",
                      language = o.s("languageCode") ?: o.s("languageTag"),
                      codec = o.s("codec"),
                      key = o.s("key"),
                      selected = o.optBoolean("selected") || o.optInt("selected") == 1,
                      forced = o.optBoolean("forced") || o.optInt("forced") == 1,
                  )
              }
          }

          data class Part(val id: Long, val key: String, val file: String?, val size: Long, val container: String?, val streams: List<Stream>) {
              companion object {
                  fun parse(o: JSONObject) = Part(
                      id = o.optLong("id"),
                      key = o.s("key") ?: "",
                      file = o.s("file"),
                      size = o.optLong("size"),
                      container = o.s("container"),
                      streams = o.optJSONArray("Stream").objs().map { Stream.parse(it) },
                  )
              }
          }

          data class Media(
              val videoResolution: String?,
              val videoCodec: String?,
              val audioCodec: String?,
              val audioChannels: Int,
              val bitrate: Int,
              val container: String?,
              val parts: List<Part>,
          ) {
              companion object {
                  fun parse(o: JSONObject) = Media(
                      videoResolution = o.s("videoResolution"),
                      videoCodec = o.s("videoCodec"),
                      audioCodec = o.s("audioCodec"),
                      audioChannels = o.optInt("audioChannels"),
                      bitrate = o.optInt("bitrate"),
                      container = o.s("container"),
                      parts = o.optJSONArray("Part").objs().map { Part.parse(it) },
                  )
              }
          }

          data class Marker(val type: String, val start: Long, val end: Long, val final: Boolean)
          data class Person(val name: String, val role: String?, val thumb: String?)
          data class Library(val key: String, val title: String, val type: String)
          data class Tag(val id: String, val title: String)

          data class Item(
              val ratingKey: String,
              val key: String?,
              val type: String,
              val title: String,
              val summary: String?,
              val tagline: String?,
              val year: Int,
              val thumb: String?,
              val art: String?,
              val parentThumb: String?,
              val grandparentThumb: String?,
              val grandparentArt: String?,
              val grandparentTitle: String?,
              val parentTitle: String?,
              val grandparentRatingKey: String?,
              val parentRatingKey: String?,
              val index: Int,
              val parentIndex: Int,
              val duration: Long,
              val viewOffset: Long,
              val viewCount: Int,
              val leafCount: Int,
              val viewedLeafCount: Int,
              val childCount: Int,
              val contentRating: String?,
              val audienceRating: Double,
              val rating: Double,
              val studio: String?,
              val released: String?,
              val guid: String?,
              val subtype: String?,
              val genres: List<String>,
              val directors: List<String>,
              val writers: List<String>,
              val cast: List<Person>,
              val media: List<Media>,
              val markers: List<Marker>,
              val extras: List<Item>,
              val related: List<Hub>,
              val onDeck: Item?,
          ) {
              val isWatched: Boolean
                  get() = if (type == "show" || type == "season") leafCount > 0 && viewedLeafCount >= leafCount else viewCount > 0

              val progress: Float
                  get() = if (duration > 0 && viewOffset > 0) (viewOffset.toFloat() / duration).coerceIn(0f, 1f) else 0f

              val poster: String?
                  get() = when (type) {
                      "episode" -> grandparentThumb ?: parentThumb ?: thumb
                      "season" -> thumb ?: parentThumb
                      else -> thumb
                  }

              val backdrop: String? get() = art ?: grandparentArt ?: thumb
              val wideImage: String? get() = if (type == "episode") thumb ?: art ?: grandparentArt else art ?: thumb
              val epLabel: String get() = if (type == "episode") "S$parentIndex:E$index" else ""
              val heading: String get() = if (type == "episode") grandparentTitle ?: title else if (type == "season") parentTitle ?: title else title
              val subheading: String
                  get() = when (type) {
                      "episode" -> "$epLabel · $title"
                      "season" -> title
                      else -> if (year > 0) "$year" else ""
                  }
              val playable: Boolean get() = type == "movie" || type == "episode" || type == "clip"

              companion object {
                  fun parse(o: JSONObject): Item {
                      val od = o.optJSONObject("OnDeck")
                      val odm = od?.optJSONObject("Metadata") ?: od?.optJSONArray("Metadata")?.optJSONObject(0)
                      return Item(
                          ratingKey = o.s("ratingKey") ?: "",
                          key = o.s("key"),
                          type = o.s("type") ?: "",
                          title = o.s("title") ?: "",
                          summary = o.s("summary"),
                          tagline = o.s("tagline"),
                          year = o.optInt("year"),
                          thumb = o.s("thumb"),
                          art = o.s("art"),
                          parentThumb = o.s("parentThumb"),
                          grandparentThumb = o.s("grandparentThumb"),
                          grandparentArt = o.s("grandparentArt"),
                          grandparentTitle = o.s("grandparentTitle"),
                          parentTitle = o.s("parentTitle"),
                          grandparentRatingKey = o.s("grandparentRatingKey"),
                          parentRatingKey = o.s("parentRatingKey"),
                          index = o.optInt("index"),
                          parentIndex = o.optInt("parentIndex"),
                          duration = o.optLong("duration"),
                          viewOffset = o.optLong("viewOffset"),
                          viewCount = o.optInt("viewCount"),
                          leafCount = o.optInt("leafCount"),
                          viewedLeafCount = o.optInt("viewedLeafCount"),
                          childCount = o.optInt("childCount"),
                          contentRating = o.s("contentRating"),
                          audienceRating = o.optDouble("audienceRating", 0.0).let { if (it.isNaN()) 0.0 else it },
                          rating = o.optDouble("rating", 0.0).let { if (it.isNaN()) 0.0 else it },
                          studio = o.s("studio"),
                          released = o.s("originallyAvailableAt"),
                          guid = o.s("guid"),
                          subtype = o.s("subtype"),
                          genres = o.tags("Genre"),
                          directors = o.tags("Director"),
                          writers = o.tags("Writer"),
                          cast = o.optJSONArray("Role").objs().map { Person(it.s("tag") ?: "", it.s("role"), it.s("thumb")) },
                          media = o.optJSONArray("Media").objs().map { Media.parse(it) },
                          markers = o.optJSONArray("Marker").objs().map {
                              Marker(it.s("type") ?: "", it.optLong("startTimeOffset"), it.optLong("endTimeOffset"), it.optBoolean("final"))
                          },
                          extras = o.optJSONObject("Extras")?.metadata() ?: emptyList(),
                          related = o.optJSONObject("Related")?.hubs() ?: emptyList(),
                          onDeck = odm?.let { parse(it) },
                      )
                  }
              }
          }

          data class Hub(val title: String, val identifier: String, val key: String?, val type: String?, val items: List<Item>, val more: Boolean) {
              val isContinue: Boolean get() = identifier.contains("continue") || identifier.contains("ondeck")

              companion object {
                  fun parse(o: JSONObject) = Hub(
                      title = o.s("title") ?: "",
                      identifier = o.s("hubIdentifier") ?: "",
                      key = o.s("key"),
                      type = o.s("type"),
                      items = o.metadata(),
                      more = o.optBoolean("more"),
                  )
              }
          }
          FEYNOS_EOF

