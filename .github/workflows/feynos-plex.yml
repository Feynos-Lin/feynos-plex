          @Composable
          fun DownloadsScreen() {
              val ctx = LocalContext.current
              var tick by remember { mutableIntStateOf(0) }
              LaunchedEffect(Unit) {
                  while (true) {
                      delay(1000)
                      tick++
                  }
              }
              Column(Modifier.fillMaxSize()) {
                  ScreenTitle("Downloads")
                  val list = Downloads.list.toList()
                  if (list.isEmpty()) {
                      Message("Nothing downloaded yet.\nTap the download icon on any movie or episode to watch it offline.")
                  } else {
                      LazyColumn(Modifier.fillMaxSize()) {
                          items(list) { d ->
                              val st = remember(tick, d.dmId) { Downloads.status(ctx, d) }
                              val done = st.state == DownloadManager.STATUS_SUCCESSFUL
                              val failed = st.state == DownloadManager.STATUS_FAILED
                              Row(
                                  Modifier.fillMaxWidth().clickable(enabled = done) {
                                      ctx.startActivity(
                                          Intent(ctx, PlayerActivity::class.java)
                                              .putExtra("rk", d.rk)
                                              .putExtra("local", d.file)
                                              .putExtra("autoResume", true)
                                      )
                                  }.padding(horizontal = 16.dp, vertical = 10.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                              ) {
                                  AsyncImage(
                                      model = File(d.thumb),
                                      contentDescription = null,
                                      contentScale = ContentScale.Crop,
                                      modifier = Modifier.width(64.dp).aspectRatio(2f / 3f).clip(RoundedCornerShape(4.dp)).background(Color(0xFF222222)),
                                  )
                                  Spacer(Modifier.width(14.dp))
                                  Column(Modifier.weight(1f)) {
                                      Text(d.title, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
