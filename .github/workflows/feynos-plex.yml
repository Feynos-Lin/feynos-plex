          package com.feynos.plex

          import android.content.Context
          import android.content.SharedPreferences
          import java.util.UUID
          import kotlin.properties.ReadWriteProperty
          import kotlin.reflect.KProperty

          class Prefs(ctx: Context) {
              val sp: SharedPreferences = ctx.getSharedPreferences("feynos_plex", Context.MODE_PRIVATE)

              private fun str(key: String) = object : ReadWriteProperty<Any?, String?> {
                  override fun getValue(thisRef: Any?, property: KProperty<*>): String? = sp.getString(key, null)
                  override fun setValue(thisRef: Any?, property: KProperty<*>, value: String?) {
                      sp.edit().putString(key, value).apply()
                  }
              }

              private fun bool(key: String, def: Boolean) = object : ReadWriteProperty<Any?, Boolean> {
                  override fun getValue(thisRef: Any?, property: KProperty<*>): Boolean = sp.getBoolean(key, def)
                  override fun setValue(thisRef: Any?, property: KProperty<*>, value: Boolean) {
                      sp.edit().putBoolean(key, value).apply()
                  }
              }

              private fun int(key: String, def: Int) = object : ReadWriteProperty<Any?, Int> {
                  override fun getValue(thisRef: Any?, property: KProperty<*>): Int = sp.getInt(key, def)
                  override fun setValue(thisRef: Any?, property: KProperty<*>, value: Int) {
                      sp.edit().putInt(key, value).apply()
                  }
              }

              val clientId: String by lazy {
                  sp.getString("client_id", null) ?: UUID.randomUUID().toString().also { sp.edit().putString("client_id", it).apply() }
              }

              var accountToken by str("account_token")
              var userToken by str("user_token")
              var userTitle by str("user_title")
              var userThumb by str("user_thumb")
              var serverName by str("server_name")
              var serverId by str("server_id")
              var serverUri by str("server_uri")
              var serverToken by str("server_token")
              var downloadsJson by str("downloads")

              /** Streaming bitrate cap in kbps; 0 means Original / direct play. */
              var quality by int("quality", 0)
              var autoplayNext by bool("autoplay_next", true)
              var autoSkipIntro by bool("auto_skip_intro", false)
          }
          FEYNOS_EOF

