                                  Icon(Icons.Default.PlayArrow, null)
                                  Spacer(Modifier.width(4.dp))
                                  Text(if (f.playable) "Play" else "Watch", fontWeight = FontWeight.Bold)
                              }
                              ActionIcon(Icons.Default.Info, "Info") { nav.openItem(f) }
                          }
                      }
                  }
              }
          }

          @Composable
          fun LibraryScreen(nav: NavController, key: String, type: String, title: String) {
              var tab by rememberSaveable { mutableIntStateOf(0) }
              Column(Modifier.fillMaxSize()) {
                  ScreenTitle(title, onBack = { nav.popBackStack() })
                  TabRow(selectedTabIndex = tab, containerColor = Bg, contentColor = Color.White) {
                      Tab(selected = tab == 0, onClick = { tab = 0 }, text = { Text("For You") })
                      Tab(selected = tab == 1, onClick = { tab = 1 }, text = { Text("Browse All") })
                  }
                  if (tab == 0) SectionHubs(nav, key) else LibraryGrid(nav, key, type)
              }
          }

          @Composable
          private fun SectionHubs(nav: NavController, key: String) {
              var hubs by remember { mutableStateOf<List<Hub>?>(null) }
              var error by remember { mutableStateOf<String?>(null) }
              var retry by remember { mutableIntStateOf(0) }
              LaunchedEffect(key, retry) {
                  try {
                      hubs = Plex.sectionHubs(key)
                      error = null
                  } catch (e: Exception) {
                      error = e.message
                  }
              }
              val h = hubs
              val err = error
              when {
                  h == null && err != null -> Message("Couldn't load this library.\n$err") { Button(onClick = { retry++ }) { Text("Retry") } }
                  h == null -> Loading()
                  else -> LazyColumn(Modifier.fillMaxSize()) {
                      items(h) { hub -> HubRow(hub, nav) }
                      item { Spacer(Modifier.height(24.dp)) }
                  }
              }
          }

          private val SORTS = listOf(
              "titleSort" to "Title",
              "addedAt:desc" to "Recently Added",
              "originallyAvailableAt:desc" to "Release Date",
              "audienceRating:desc" to "Rating",
              "lastViewedAt:desc" to "Last Watched",
              "random" to "Shuffle",
          )

          @Composable
          private fun LibraryGrid(nav: NavController, key: String, type: String) {
              val scope = rememberCoroutineScope()
              var sort by rememberSaveable { mutableStateOf("titleSort") }
              var genre by remember { mutableStateOf<Tag?>(null) }
              var unwatched by rememberSaveable { mutableStateOf(false) }
              var genres by remember { mutableStateOf<List<Tag>>(emptyList()) }
              val list = remember { mutableStateListOf<Item>() }
              var total by remember { mutableIntStateOf(-1) }
              var loading by remember { mutableStateOf(false) }
              var gen by remember { mutableIntStateOf(0) }
              var sortMenu by remember { mutableStateOf(false) }
              var genreMenu by remember { mutableStateOf(false) }

              LaunchedEffect(key) { genres = runCatching { Plex.genres(key, type) }.getOrDefault(emptyList()) }

              fun loadMore() {
                  if (loading || (total >= 0 && list.size >= total)) return
                  loading = true
                  val g = gen
                  scope.launch {
                      try {
                          val (page, t) = Plex.browse(key, type, sort, genre?.id, unwatched, list.size, 60)
                          if (g != gen) return@launch
                          list.addAll(page)
                          total = if (page.isEmpty()) list.size else if (t >= 0) t else Int.MAX_VALUE
                      } catch (e: Exception) {
                          if (g == gen) total = list.size
                      } finally {
                          if (g == gen) loading = false
                      }
                  }
              }

              LaunchedEffect(sort, genre, unwatched) {
                  gen++
                  list.clear()
                  total = -1
                  loading = false
                  loadMore()
              }

              Column(Modifier.fillMaxSize()) {
                  Row(
                      Modifier.horizontalScroll(rememberScrollState()).padding(horizontal = 12.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      Box {
                          FilterChip(
                              selected = false,
                              onClick = { sortMenu = true },
                              label = { Text(SORTS.firstOrNull { it.first == sort }?.second ?: "Sort") },
                              trailingIcon = { Icon(Icons.Default.ArrowDropDown, null) },
                          )
                          DropdownMenu(expanded = sortMenu, onDismissRequest = { sortMenu = false }) {
                              SORTS.forEach { (k, l) ->
                                  DropdownMenuItem(text = { Text(l) }, onClick = {
                                      sort = k
                                      sortMenu = false
                                  })
                              }
                          }
                      }
                      if (genres.isNotEmpty()) Box {
                          FilterChip(
                              selected = genre != null,
                              onClick = { genreMenu = true },
                              label = { Text(genre?.title ?: "Genre") },
                              trailingIcon = { Icon(Icons.Default.ArrowDropDown, null) },
                          )
                          DropdownMenu(expanded = genreMenu, onDismissRequest = { genreMenu = false }, modifier = Modifier.heightIn(max = 420.dp)) {
                              DropdownMenuItem(text = { Text("All genres") }, onClick = {
                                  genre = null
                                  genreMenu = false
                              })
                              genres.forEach { g ->
                                  DropdownMenuItem(text = { Text(g.title) }, onClick = {
                                      genre = g
                                      genreMenu = false
                                  })
                              }
                          }
                      }
                      FilterChip(selected = unwatched, onClick = { unwatched = !unwatched }, label = { Text("Unwatched") })
                      if (total in 1 until Int.MAX_VALUE) Text("$total titles", color = Muted, style = MaterialTheme.typography.labelMedium)
                  }
                  if (list.isEmpty() && !loading && total == 0) {
                      Message("Nothing matches these filters.")
                  } else {
                      LazyVerticalGrid(
                          GridCells.Adaptive(108.dp),
                          Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(12.dp),
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          itemsIndexed(list) { i, x ->
                              if (i >= list.size - 15) LaunchedEffect(list.size) { loadMore() }
                              PosterCard(x, Modifier.fillMaxWidth(), showTitle = true) { nav.openItem(x) }
                          }
                          if (loading) item(span = { GridItemSpan(maxLineSpan) }) {
                              Box(Modifier.fillMaxWidth().padding(16.dp), contentAlignment = Alignment.Center) { CircularProgressIndicator(color = Accent) }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SearchScreen(nav: NavController) {
              var query by rememberSaveable { mutableStateOf("") }
              var results by remember { mutableStateOf<List<Hub>>(emptyList()) }
              var loading by remember { mutableStateOf(false) }
              LaunchedEffect(query) {
                  loading = false
                  val q = query.trim()
                  if (q.length < 2) {
                      results = emptyList()
                      return@LaunchedEffect
                  }
                  delay(350)
                  loading = true
                  results = runCatching { Plex.search(q) }.getOrDefault(emptyList())
                  loading = false
              }
              Column(Modifier.fillMaxSize().statusBarsPadding()) {
                  OutlinedTextField(
                      query, { query = it },
                      modifier = Modifier.fillMaxWidth().padding(12.dp),
                      placeholder = { Text("Search movies, shows, episodes") },
                      leadingIcon = { Icon(Icons.Default.Search, null) },
                      trailingIcon = {
                          if (query.isNotEmpty()) IconButton(onClick = { query = "" }) { Icon(Icons.Default.Close, "Clear") }
                      },
                      singleLine = true,
                      shape = RoundedCornerShape(8.dp),
                  )
                  val q = query.trim()
                  when {
                      q.length < 2 -> SearchSuggestions(nav)
                      loading && results.isEmpty() -> Loading()
                      results.isEmpty() -> Message("No results for \"$q\"")
                      else -> LazyColumn(Modifier.fillMaxSize()) {
                          items(results) { h -> HubRow(h, nav) }
                          item { Spacer(Modifier.height(24.dp)) }
                      }
                  }
              }
          }

          @Composable
          private fun SearchSuggestions(nav: NavController) {
              val libs = Cache.libs
              LazyColumn(Modifier.fillMaxSize()) {
                  item { Text("Browse", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, modifier = Modifier.padding(16.dp)) }
                  items(libs) { l ->
                      Row(
                          Modifier.fillMaxWidth().clickable { nav.navigate(libRoute(l)) }.padding(horizontal = 16.dp, vertical = 14.dp),
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          Icon(if (l.type == "show") Icons.Default.Tv else Icons.Default.Movie, null, tint = Accent)
                          Spacer(Modifier.width(14.dp))
                          Text(l.title)
                      }
                  }
              }
          }

          @Composable
          fun MyListScreen(nav: NavController) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var opening by remember { mutableStateOf(false) }
              OnResume { scope.launch { Watchlist.refresh() } }
              Column(Modifier.fillMaxSize()) {
                  ScreenTitle("My List")
                  val list = Watchlist.items
                  when {
                      !Watchlist.loaded -> Loading()
                      list.isEmpty() -> Message("Your list is empty.\nTap + My List on any movie or show to save it here.")
                      else -> LazyVerticalGrid(
                          GridCells.Adaptive(108.dp),
                          Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(12.dp),
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          items(list) { x ->
                              PosterCard(x, Modifier.fillMaxWidth(), showTitle = true, onLongClick = {
                                  scope.launch { Watchlist.toggle(x); ctx.toast("Removed ${x.title}") }
                              }) {
                                  val g = x.guid
                                  if (!opening && g != null) {
                                      opening = true
                                      scope.launch {
                                          val local = Plex.findOnServer(g, x.title, x.year)
                                          opening = false
                                          if (local != null) nav.navigate("detail/${local.ratingKey}")
                                          else ctx.toast("${x.title} isn't on ${Plex.prefs.serverName ?: "your server"} yet")
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          FEYNOS_EOF

