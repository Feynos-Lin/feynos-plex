              fun use(name: String, id: String?, uri: String, token: String?) {
                  val p = Plex.prefs
                  p.serverName = name
                  p.serverId = id
                  p.serverToken = token
                  p.serverUri = uri
                  Cache.clear()
                  Session.refresh()
              }

              fun connect(s: Server) {
                  connecting = s.name
                  error = null
                  scope.launch {
                      val uri = Plex.connect(s)
                      if (uri == null) {
                          error = "Couldn't reach ${s.name}. Make sure it's online."
                          connecting = null
                      } else use(s.name, s.id, uri, s.token)
                  }
              }

              fun connectCustom() {
                  val url = custom.trim().trimEnd('/').let { if (it.startsWith("http")) it else "http://$it" }
                  connecting = url
                  error = null
                  scope.launch {
                      try {
                          val id = Plex.probe(url, Plex.prefs.userToken)
                          val match = servers?.firstOrNull { it.id == id }
                          use(match?.name ?: url, id, url, match?.token ?: Plex.prefs.userToken)
                      } catch (e: Exception) {
                          error = "Couldn't connect to $url"
                          connecting = null
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  try {
                      val list = Plex.servers()
                      servers = list
                      if (list.size == 1) connect(list.first())
                  } catch (e: Exception) {
                      servers = emptyList()
                      error = "Couldn't load servers (${e.message})"
                  }
