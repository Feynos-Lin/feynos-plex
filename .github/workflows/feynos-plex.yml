          mkdir -p "app/src/main/java/com/feynos/plex"
          cat > "app/src/main/java/com/feynos/plex/Plex.kt" <<'FEYNOS_EOF'
          package com.feynos.plex

          import android.content.Context
          import android.os.Build
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.async
          import kotlinx.coroutines.awaitAll
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.withContext
          import okhttp3.FormBody
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.URLEncoder
          import java.util.concurrent.TimeUnit

          class PlexException(val code: Int, msg: String) : Exception(msg)

          data class Pin(val id: Long, val code: String)
          data class HomeUser(val id: String, val title: String, val thumb: String?, val protected: Boolean, val admin: Boolean)
          data class Conn(val uri: String, val local: Boolean, val relay: Boolean)
          data class Server(val name: String, val id: String, val token: String?, val owned: Boolean, val conns: List<Conn>)

          object Plex {
              const val PRODUCT = "Feynos Plex"

              val QUALITIES = listOf(
                  0 to "Original (direct play)",
                  20000 to "20 Mbps · 1080p",
                  12000 to "12 Mbps · 1080p",
                  8000 to "8 Mbps · 1080p",
                  4000 to "4 Mbps · 720p",
                  2000 to "2 Mbps · 720p",
                  1000 to "1 Mbps · 480p",
              )

              fun qualityLabel(kbps: Int) = QUALITIES.firstOrNull { it.first == kbps }?.second ?: "${kbps / 1000} Mbps"

              lateinit var prefs: Prefs
              lateinit var app: Context
              val bg = CoroutineScope(SupervisorJob() + Dispatchers.IO)

              val http: OkHttpClient = OkHttpClient.Builder()
                  .connectTimeout(12, TimeUnit.SECONDS)
                  .readTimeout(30, TimeUnit.SECONDS)
                  .build()
              private val fast: OkHttpClient = http.newBuilder()
                  .connectTimeout(4, TimeUnit.SECONDS)
                  .readTimeout(6, TimeUnit.SECONDS)
                  .build()

              fun init(ctx: Context) {
                  app = ctx.applicationContext
                  prefs = Prefs(app)
              }

              fun enc(s: String): String = URLEncoder.encode(s, "UTF-8")

              fun headers(): Map<String, String> = mapOf(
                  "X-Plex-Product" to PRODUCT,
                  "X-Plex-Version" to BuildConfig.VERSION_NAME,
                  "X-Plex-Client-Identifier" to prefs.clientId,
                  "X-Plex-Platform" to "Android",
                  "X-Plex-Platform-Version" to Build.VERSION.RELEASE,
                  "X-Plex-Device" to Build.MODEL,
                  "X-Plex-Device-Name" to "${Build.MANUFACTURER} ${Build.MODEL}",
                  "X-Plex-Model" to Build.MODEL,
                  "X-Plex-Provides" to "player",
                  "Accept" to "application/json",
              )

              suspend fun request(
                  url: String,
                  token: String?,
                  method: String = "GET",
                  form: Map<String, String>? = null,
                  quick: Boolean = false,
              ): String = withContext(Dispatchers.IO) {
                  val b = Request.Builder().url(url)
                  headers().forEach { (k, v) -> b.header(k, v) }
                  if (token != null) b.header("X-Plex-Token", token)
                  when {
                      form != null -> {
                          val fb = FormBody.Builder()
                          form.forEach { (k, v) -> fb.add(k, v) }
                          b.method(method, fb.build())
                      }
                      method == "GET" || method == "DELETE" -> b.method(method, null)
                      else -> b.method(method, ByteArray(0).toRequestBody(null))
                  }
                  val client = if (quick) fast else http
                  client.newCall(b.build()).execute().use { r ->
                      val body = r.body?.string() ?: ""
                      if (!r.isSuccessful) throw PlexException(r.code, "HTTP ${r.code}")
                      body
                  }
              }

              // ---------------- plex.tv account ----------------

              suspend fun createPin(): Pin {
                  val o = JSONObject(request("https://plex.tv/api/v2/pins", null, "POST"))
                  return Pin(o.getLong("id"), o.getString("code"))
              }

              suspend fun pinToken(id: Long): String? = JSONObject(request("https://plex.tv/api/v2/pins/$id", null)).s("authToken")

              fun linkUrl(code: String) =
                  "https://app.plex.tv/auth#?clientID=${enc(prefs.clientId)}&code=${enc(code)}&context%5Bdevice%5D%5Bproduct%5D=${enc(PRODUCT)}"

              suspend fun signIn(login: String, password: String, code: String): String {
                  val form = mutableMapOf("login" to login, "password" to password, "rememberMe" to "true")
                  if (code.isNotBlank()) form["verificationCode"] = code
                  val o = JSONObject(request("https://plex.tv/api/v2/users/signin", null, "POST", form))
                  return o.getString("authToken")
              }

              suspend fun account(token: String): JSONObject = JSONObject(request("https://plex.tv/api/v2/user", token))

              suspend fun homeUsers(): List<HomeUser> {
                  val txt = request("https://plex.tv/api/v2/home/users", prefs.accountToken).trim()
                  val arr = if (txt.startsWith("[")) JSONArray(txt) else JSONObject(txt).optJSONArray("users")
                  return arr.objs().map {
                      HomeUser(
                          id = it.s("uuid") ?: it.s("id") ?: "",
                          title = it.s("title") ?: it.s("username") ?: "User",
                          thumb = it.s("thumb"),
                          protected = it.optBoolean("protected"),
                          admin = it.optBoolean("admin"),
                      )
                  }
              }

              suspend fun switchUser(u: HomeUser, pin: String?): String {
                  val url = "https://plex.tv/api/v2/home/users/${u.id}/switch" + (pin?.let { "?pin=${enc(it)}" } ?: "")
                  return JSONObject(request(url, prefs.accountToken, "POST")).getString("authToken")
              }

              suspend fun servers(): List<Server> {
                  val txt = request("https://plex.tv/api/v2/resources?includeHttps=1&includeRelay=1", prefs.userToken)
                  return JSONArray(txt).objs()
                      .filter { (it.s("provides") ?: "").contains("server") }
                      .map { o ->
                          Server(
                              name = o.s("name") ?: "Plex Server",
                              id = o.s("clientIdentifier") ?: "",
                              token = o.s("accessToken") ?: prefs.userToken,
                              owned = o.optBoolean("owned"),
                              conns = o.optJSONArray("connections").objs().mapNotNull { c ->
                                  c.s("uri")?.let { Conn(it, c.optBoolean("local"), c.optBoolean("relay")) }
                              },
                          )
                      }
              }

              /** Returns the server's machineIdentifier if reachable. */
              suspend fun probe(uri: String, token: String?): String =
                  JSONObject(request("$uri/identity", token, quick = true)).optJSONObject("MediaContainer")?.s("machineIdentifier") ?: ""

              /** Tries every connection in parallel and returns the best one that answers. */
              suspend fun connect(s: Server): String? = coroutineScope {
                  val ordered = s.conns.sortedBy { c ->
                      when {
                          c.local && !c.relay -> 0
                          !c.relay -> 1
                          else -> 2
                      }
                  }
                  ordered.map { c ->
                      async { runCatching { probe(c.uri, s.token); c.uri }.getOrNull() }
                  }.awaitAll().firstOrNull { it != null }
              }

              // ---------------- Plex Media Server ----------------

              private val base: String get() = prefs.serverUri ?: ""
              private val stoken: String? get() = prefs.serverToken

              suspend fun pms(path: String, method: String = "GET"): JSONObject {
                  val txt = request(base + path, stoken, method)
                  if (txt.isBlank()) return JSONObject()
                  return runCatching { JSONObject(txt).optJSONObject("MediaContainer") ?: JSONObject() }.getOrDefault(JSONObject())
              }

              private val videoTypes = setOf("movie", "show", "season", "episode")

              suspend fun homeHubs(): List<Hub> =
                  pms("/hubs?count=20&includeLibraryPlaylists=0").hubs()
                      .map { h -> h.copy(items = h.items.filter { it.type in videoTypes }) }
                      .filter { it.items.isNotEmpty() }
                      .sortedBy {
                          when {
                              it.identifier.contains("continue") -> 0
                              it.identifier.contains("ondeck") -> 1
                              else -> 2
                          }
                      }

              suspend fun libraries(): List<Library> =
                  pms("/library/sections").optJSONArray("Directory").objs()
                      .map { Library(it.s("key") ?: "", it.s("title") ?: "", it.s("type") ?: "") }
                      .filter { it.type == "movie" || it.type == "show" }

              suspend fun sectionHubs(key: String): List<Hub> =
                  pms("/hubs/sections/$key?count=20").hubs().filter { it.items.isNotEmpty() }

              suspend fun browse(key: String, type: String, sort: String, genre: String?, unwatched: Boolean, start: Int, size: Int): Pair<List<Item>, Int> {
                  val t = if (type == "show") 2 else 1
                  var p = "/library/sections/$key/all?type=$t&sort=${enc(sort)}&X-Plex-Container-Start=$start&X-Plex-Container-Size=$size"
                  if (genre != null) p += "&genre=${enc(genre)}"
                  if (unwatched) p += "&unwatched=1"
                  val mc = pms(p)
                  return mc.metadata() to mc.optInt("totalSize", -1)
              }

              suspend fun genres(key: String, type: String): List<Tag> =
                  pms("/library/sections/$key/genre?type=${if (type == "show") 2 else 1}").optJSONArray("Directory").objs().map {
                      val k = it.s("key") ?: ""
                      Tag(if (k.contains("genre=")) k.substringAfter("genre=").substringBefore("&") else k, it.s("title") ?: "")
                  }

              suspend fun metadata(rk: String): Item? =
                  pms("/library/metadata/$rk?includeExtras=1&includeMarkers=1&includeRelated=1&includeOnDeck=1&checkFiles=0").metadata().firstOrNull()

              suspend fun children(rk: String): List<Item> = pms("/library/metadata/$rk/children").metadata()
              suspend fun allLeaves(rk: String): List<Item> = pms("/library/metadata/$rk/allLeaves").metadata()

              suspend fun search(q: String): List<Hub> =
                  pms("/hubs/search?query=${enc(q)}&limit=30").hubs()
                      .map { h -> h.copy(items = h.items.filter { it.type in videoTypes }) }
                      .filter { it.items.isNotEmpty() }

              suspend fun scrobble(rk: String, watched: Boolean) {
                  request(base + "/:/${if (watched) "scrobble" else "unscrobble"}?key=$rk&identifier=com.plexapp.plugins.library", stoken)
              }

              suspend fun timeline(rk: String, state: String, time: Long, duration: Long) {
                  runCatching {
                      request(
                          base + "/:/timeline?ratingKey=$rk&key=${enc("/library/metadata/$rk")}&state=$state&time=$time&duration=$duration&playbackTime=$time",
                          stoken,
                      )
                  }
              }

              suspend fun setStreams(partId: Long, audio: Long?, subtitle: Long?) {
                  var q = "/library/parts/$partId?allParts=1"
                  if (audio != null) q += "&audioStreamID=$audio"
                  if (subtitle != null) q += "&subtitleStreamID=$subtitle"
                  request(base + q, stoken, "PUT")
              }

              suspend fun stopTranscode(session: String) {
                  runCatching { request(base + "/video/:/transcode/universal/stop?session=$session", stoken) }
              }

              suspend fun findOnServer(guid: String, title: String, year: Int): Item? {
                  runCatching {
                      pms("/library/all?guid=${enc(guid)}").metadata().firstOrNull { it.type == "movie" || it.type == "show" }
                  }.getOrNull()?.let { return it }
                  val found = runCatching { search(title).flatMap { it.items } }.getOrDefault(emptyList())
                  return found.firstOrNull { it.guid == guid }
                      ?: found.firstOrNull { (it.type == "movie" || it.type == "show") && it.title.equals(title, true) && (year == 0 || it.year == year) }
              }

              // ---------------- URLs ----------------

              fun img(path: String?, w: Int, h: Int): String? {
                  if (path.isNullOrEmpty()) return null
                  if (path.startsWith("http")) return path
                  return "$base/photo/:/transcode?width=$w&height=$h&minSize=1&upscale=1&url=${enc(path)}&X-Plex-Token=${stoken ?: ""}"
              }

              fun directUrl(part: Part) = "$base${part.key}?X-Plex-Token=${stoken ?: ""}"
              fun downloadUrl(part: Part) = "$base${part.key}?download=1&X-Plex-Token=${stoken ?: ""}"
              fun streamUrl(key: String) = "$base$key?X-Plex-Token=${stoken ?: ""}"

              fun transcodeUrl(rk: String, session: String, kbps: Int): String {
                  val res = when {
                      kbps >= 8000 -> "1920x1080"
                      kbps >= 2000 -> "1280x720"
                      else -> "854x480"
                  }
                  val profileExtra =
                      "add-transcode-target(type=videoProfile&context=streaming&protocol=hls&container=mpegts&videoCodec=h264&audioCodec=aac,ac3,eac3)"
                  val params = mutableListOf(
                      "path" to "/library/metadata/$rk",
                      "mediaIndex" to "0",
                      "partIndex" to "0",
                      "protocol" to "hls",
                      "fastSeek" to "1",
                      "directPlay" to "0",
                      "directStream" to "1",
                      "directStreamAudio" to "1",
                      "videoQuality" to "100",
                      "maxVideoBitrate" to "$kbps",
                      "videoResolution" to res,
                      "subtitleSize" to "100",
                      "audioBoost" to "100",
                      "subtitles" to "burn",
                      "copyts" to "1",
                      "autoAdjustQuality" to "0",
                      "hasMDE" to "1",
                      "location" to "lan",
                      "session" to session,
                      "X-Plex-Session-Identifier" to session,
                      "X-Plex-Client-Profile-Extra" to profileExtra,
                      "X-Plex-Token" to (stoken ?: ""),
                  )
                  headers().filterKeys { it.startsWith("X-Plex") }.forEach { (k, v) -> params.add(k to v) }
                  return "$base/video/:/transcode/universal/start.m3u8?" + params.joinToString("&") { "${enc(it.first)}=${enc(it.second)}" }
              }

              // ---------------- Watchlist (plex.tv Discover) ----------------

              suspend fun watchlist(): List<Item> =
                  JSONObject(
                      request(
                          "https://discover.provider.plex.tv/library/sections/watchlist/all?X-Plex-Container-Start=0&X-Plex-Container-Size=300",
                          prefs.userToken,
                      )
                  ).optJSONObject("MediaContainer")?.metadata() ?: emptyList()

              suspend fun setWatchlist(guid: String, add: Boolean) {
                  val id = guid.substringAfterLast('/')
                  val action = if (add) "addToWatchlist" else "removeFromWatchlist"
                  request("https://discover.provider.plex.tv/actions/$action?ratingKey=${enc(id)}", prefs.userToken, "PUT")
              }
          }

          object Watchlist {
              var items by mutableStateOf<List<Item>>(emptyList())
              var loaded by mutableStateOf(false)

              fun has(guid: String?): Boolean = guid != null && items.any { it.guid == guid }
              fun supports(item: Item): Boolean = (item.type == "movie" || item.type == "show") && item.guid?.startsWith("plex://") == true

              suspend fun refresh() {
                  runCatching { items = Plex.watchlist() }
                  loaded = true
              }

              suspend fun toggle(item: Item) {
                  val g = item.guid ?: return
                  val add = !has(g)
                  items = if (add) listOf(item) + items else items.filter { it.guid != g }
                  runCatching { Plex.setWatchlist(g, add) }
                  refresh()
              }
          }
          FEYNOS_EOF

