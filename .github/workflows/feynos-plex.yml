                                          }
                                      }
                                  }
                                  if (done) Icon(Icons.Default.PlayCircle, null, tint = Color.White, modifier = Modifier.padding(horizontal = 6.dp))
                                  IconButton(onClick = { Downloads.delete(ctx, d) }) { Icon(Icons.Default.Delete, "Delete", tint = Muted) }
                              }
                          }
                      }
