      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'feynosplex' }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
          elif [ -f keystore/release.jks ]; then
            cp keystore/release.jks release.jks
          else
            # First build: make a key and keep it in the repo so every future
            # build is signed the same way (needed for in-app updates).
            keytool -genkeypair -keystore release.jks -alias feynos -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Feynos Plex"
            mkdir -p keystore
            cp release.jks keystore/release.jks
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/release.jks
            git commit -m "Add app signing key [skip ci]"
            git push
          fi

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'feynosplex' }}
        run: |
          gradle --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "FeynosPlex-1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FeynosPlex-1.0.${{ github.run_number }}
          path: FeynosPlex-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Feynos Plex 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Manual build' }}
          files: FeynosPlex-*.apk
          make_latest: true
