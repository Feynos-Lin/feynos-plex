          import androidx.navigation.compose.currentBackStackEntryAsState
          import androidx.navigation.compose.rememberNavController

          class FeynosApp : Application() {
              override fun onCreate() {
                  super.onCreate()
                  Plex.init(this)
                  Downloads.load()
              }
          }

          enum class Stage { Login, Profiles, Servers, Main }

          object Session {
              var stage by mutableStateOf(Stage.Login)

              fun refresh() {
                  val p = Plex.prefs
                  stage = when {
                      p.accountToken == null -> Stage.Login
                      p.userToken == null -> Stage.Profiles
                      p.serverUri == null -> Stage.Servers
                      else -> Stage.Main
                  }
              }

              suspend fun signedIn(token: String) {
                  val p = Plex.prefs
                  p.accountToken = token
                  runCatching {
                      val a = Plex.account(token)
                      p.userTitle = a.s("title") ?: a.s("username")
                      p.userThumb = a.s("thumb")
                  }
                  val users = runCatching { Plex.homeUsers() }.getOrDefault(emptyList())
                  if (users.size <= 1) p.userToken = token
                  refresh()
              }

              fun switchProfile() {
                  val p = Plex.prefs
                  p.userToken = null
                  p.serverUri = null
                  p.serverToken = null
                  Cache.clear()
                  Watchlist.items = emptyList()
                  refresh()
              }

              fun switchServer() {
                  Plex.prefs.serverUri = null
                  Plex.prefs.serverToken = null
                  Cache.clear()
                  refresh()
              }

              fun signOut() {
                  val p = Plex.prefs
                  p.accountToken = null
                  p.userToken = null
                  p.userTitle = null
                  p.userThumb = null
                  p.serverUri = null
                  p.serverToken = null
                  p.serverName = null
                  Cache.clear()
                  Watchlist.items = emptyList()
                  refresh()
              }
          }

          object Cache {
              var hubs by mutableStateOf<List<Hub>?>(null)
              var libs by mutableStateOf<List<Library>>(emptyList())
              fun clear() {
                  hubs = null
                  libs = emptyList()
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  Session.refresh()
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  setContent {
                      FeynosTheme {
                          Surface(Modifier.fillMaxSize(), color = Bg) { Root() }
                      }
                  }
              }
          }

          @Composable
          fun Root() {
              when (Session.stage) {
                  Stage.Login -> LoginScreen()
                  Stage.Profiles -> ProfileScreen()
                  Stage.Servers -> ServerScreen()
                  Stage.Main -> MainScreen()
              }
          }

          private data class NavTab(val route: String, val label: String, val icon: ImageVector)

          @Composable
          fun MainScreen() {
              val nav = rememberNavController()
              val entry by nav.currentBackStackEntryAsState()
              val route = entry?.destination?.route
              var update by remember { mutableStateOf<Updater.Release?>(null) }

              LaunchedEffect(Unit) {
                  Watchlist.refresh()
                  update = Updater.check()
              }

              val tabs = listOf(
                  NavTab("home", "Home", Icons.Default.Home),
                  NavTab("search", "Search", Icons.Default.Search),
                  NavTab("mylist", "My List", Icons.Default.Bookmark),
                  NavTab("downloads", "Downloads", Icons.Default.Download),
                  NavTab("more", "More", Icons.Default.Menu),
              )

              Scaffold(
                  containerColor = Bg,
                  contentWindowInsets = WindowInsets(0, 0, 0, 0),
                  bottomBar = {
                      NavigationBar(containerColor = Color(0xFF111111)) {
                          tabs.forEach { t ->
                              NavigationBarItem(
                                  selected = route == t.route,
                                  onClick = {
                                      nav.navigate(t.route) {
                                          popUpTo(nav.graph.findStartDestination().id) { saveState = true }
                                          launchSingleTop = true
                                          restoreState = true
                                      }
                                  },
                                  icon = { Icon(t.icon, contentDescription = t.label) },
                                  label = { Text(t.label) },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = Color.White,
                                      selectedTextColor = Color.White,
                                      indicatorColor = Color(0xFF333333),
                                      unselectedIconColor = Muted,
                                      unselectedTextColor = Muted,
                                  ),
                              )
                          }
                      }
                  },
              ) { pad ->
                  NavHost(nav, startDestination = "home", modifier = Modifier.fillMaxSize().padding(pad)) {
                      composable("home") { HomeScreen(nav) }
                      composable("search") { SearchScreen(nav) }
                      composable("mylist") { MyListScreen(nav) }
                      composable("downloads") { DownloadsScreen() }
                      composable("more") { MoreScreen() }
                      composable("library/{key}/{type}/{title}") { e ->
                          val a = e.arguments
                          LibraryScreen(nav, a?.getString("key") ?: "", a?.getString("type") ?: "movie", a?.getString("title") ?: "")
                      }
                      composable("detail/{rk}") { e -> DetailScreen(nav, e.arguments?.getString("rk") ?: "") }
                  }
              }

              update?.let { r -> UpdateDialog(r) { update = null } }
          }
