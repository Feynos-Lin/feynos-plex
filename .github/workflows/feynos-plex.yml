          cat > "app/src/main/java/com/feynos/plex/Downloads.kt" <<'FEYNOS_EOF'
          package com.feynos.plex

          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Environment
          import android.provider.Settings
          import androidx.compose.runtime.mutableStateListOf
          import androidx.core.content.FileProvider
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import okhttp3.Request
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          data class DownloadEntry(
              val rk: String,
              val title: String,
              val subtitle: String,
              val thumb: String,
              val file: String,
              val dmId: Long,
              val duration: Long,
          )

          object Downloads {
              val list = mutableStateListOf<DownloadEntry>()

              data class Status(val state: Int, val progress: Float)

              fun load() {
                  list.clear()
                  val s = Plex.prefs.downloadsJson ?: return
                  runCatching {
                      JSONArray(s).objs().forEach { o ->
                          list.add(
                              DownloadEntry(
                                  o.optString("rk"), o.optString("title"), o.optString("subtitle"), o.optString("thumb"),
                                  o.optString("file"), o.optLong("dmId"), o.optLong("duration"),
                              )
                          )
                      }
                  }
              }

              private fun save() {
                  val a = JSONArray()
                  list.forEach { d ->
                      a.put(
                          JSONObject().put("rk", d.rk).put("title", d.title).put("subtitle", d.subtitle).put("thumb", d.thumb)
                              .put("file", d.file).put("dmId", d.dmId).put("duration", d.duration)
                      )
                  }
                  Plex.prefs.downloadsJson = a.toString()
              }

              fun find(rk: String): DownloadEntry? = list.firstOrNull { it.rk == rk }

              fun start(ctx: Context, item: Item): Boolean {
                  val part = item.media.firstOrNull()?.parts?.firstOrNull() ?: return false
                  val ext = part.container ?: part.file?.substringAfterLast('.', "mkv") ?: "mkv"
                  val name = "${item.ratingKey}.$ext"
                  val dir = ctx.getExternalFilesDir(Environment.DIRECTORY_MOVIES) ?: return false
                  val dest = File(dir, name)
                  if (dest.exists()) dest.delete()
                  val title = if (item.type == "episode") "${item.heading} · ${item.epLabel}" else item.title
                  val req = DownloadManager.Request(Uri.parse(Plex.downloadUrl(part)))
                      .setTitle(title)
                      .setDescription("Feynos Plex")
                      .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                      .setDestinationInExternalFilesDir(ctx, Environment.DIRECTORY_MOVIES, name)
                      .setAllowedOverMetered(true)
                      .setAllowedOverRoaming(true)
                  val dm = ctx.getSystemService(DownloadManager::class.java) ?: return false
                  val id = dm.enqueue(req)

                  val thumbFile = File(ctx.filesDir, "thumbs/${item.ratingKey}.jpg")
                  val thumbUrl = Plex.img(item.poster, 300, 450)
                  if (thumbUrl != null) {
                      Plex.bg.launch {
                          runCatching {
                              thumbFile.parentFile?.mkdirs()
                              Plex.http.newCall(Request.Builder().url(thumbUrl).build()).execute().use { r ->
                                  r.body?.byteStream()?.use { input -> thumbFile.outputStream().use { input.copyTo(it) } }
                              }
                          }
                      }
                  }

                  list.removeAll { it.rk == item.ratingKey }
                  list.add(
                      0,
                      DownloadEntry(
                          rk = item.ratingKey,
                          title = item.heading,
                          subtitle = if (item.type == "episode") "${item.epLabel} · ${item.title}" else if (item.year > 0) "${item.year}" else "",
                          thumb = thumbFile.absolutePath,
                          file = dest.absolutePath,
                          dmId = id,
                          duration = item.duration,
                      )
                  )
                  save()
                  return true
              }

              fun status(ctx: Context, d: DownloadEntry): Status {
                  val dm = ctx.getSystemService(DownloadManager::class.java)
                  val fallback = Status(if (File(d.file).exists()) DownloadManager.STATUS_SUCCESSFUL else DownloadManager.STATUS_FAILED, 1f)
                  if (dm == null) return fallback
                  return runCatching {
                      dm.query(DownloadManager.Query().setFilterById(d.dmId)).use { c ->
                          if (c == null || !c.moveToFirst()) return@use fallback
                          val st = c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS))
                          val done = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR))
                          val total = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES))
                          Status(st, if (total > 0) done.toFloat() / total else 0f)
                      }
                  }.getOrDefault(fallback)
              }

              fun isComplete(ctx: Context, d: DownloadEntry) = status(ctx, d).state == DownloadManager.STATUS_SUCCESSFUL

              fun delete(ctx: Context, d: DownloadEntry) {
                  runCatching { ctx.getSystemService(DownloadManager::class.java)?.remove(d.dmId) }
                  File(d.file).delete()
                  File(d.thumb).delete()
                  list.remove(d)
                  save()
              }
          }

          object Updater {
              data class Release(val build: Int, val name: String, val notes: String, val apkUrl: String)

              suspend fun latest(): Release? {
                  if (BuildConfig.REPO.isBlank()) return null
                  return runCatching {
                      val o = JSONObject(Plex.request("https://api.github.com/repos/${BuildConfig.REPO}/releases/latest", null))
                      val tag = o.s("tag_name") ?: return null
                      val build = tag.substringAfterLast('.').filter { it.isDigit() }.toIntOrNull() ?: return null
                      val apk = o.optJSONArray("assets").objs().firstOrNull { (it.s("name") ?: "").endsWith(".apk") }?.s("browser_download_url")
                          ?: return null
                      Release(build, o.s("name") ?: tag, o.s("body") ?: "", apk)
                  }.getOrNull()
              }

              suspend fun check(): Release? = latest()?.takeIf { it.build > BuildConfig.VERSION_CODE }

              suspend fun download(r: Release, onProgress: (Float) -> Unit): File = withContext(Dispatchers.IO) {
                  val f = File(Plex.app.cacheDir, "update.apk")
                  Plex.http.newCall(Request.Builder().url(r.apkUrl).build()).execute().use { resp ->
                      if (!resp.isSuccessful) throw Exception("Download failed (HTTP ${resp.code})")
                      val body = resp.body ?: throw Exception("Empty download")
                      val total = body.contentLength()
                      body.byteStream().use { input ->
                          f.outputStream().use { out ->
                              val buf = ByteArray(64 * 1024)
                              var read = 0L
                              while (true) {
                                  val n = input.read(buf)
                                  if (n < 0) break
                                  out.write(buf, 0, n)
                                  read += n
                                  if (total > 0) onProgress(read.toFloat() / total)
                              }
                          }
                      }
                  }
                  f
              }

              fun install(ctx: Context, f: File) {
                  if (!ctx.packageManager.canRequestPackageInstalls()) {
                      ctx.startActivity(
                          Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:${ctx.packageName}"))
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                      return
                  }
                  val uri = FileProvider.getUriForFile(ctx, "${ctx.packageName}.files", f)
                  ctx.startActivity(
                      Intent(Intent.ACTION_VIEW)
                          .setDataAndType(uri, "application/vnd.android.package-archive")
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              }
          }
          FEYNOS_EOF

