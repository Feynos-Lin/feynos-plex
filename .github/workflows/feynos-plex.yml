          @androidx.annotation.OptIn(UnstableApi::class)
          class PlayerActivity : ComponentActivity() {
              private lateinit var player: ExoPlayer

              private var current by mutableStateOf<Item?>(null)
              private var next by mutableStateOf<Item?>(null)
              private var transcoding by mutableStateOf(false)
              private var kbps by mutableIntStateOf(0)
              private var controlsVisible by mutableStateOf(true)
              private var inPip by mutableStateOf(false)
              private var position by mutableLongStateOf(0L)
              private var duration by mutableLongStateOf(0L)
              private var countdown by mutableIntStateOf(-1)
              private var creditsDismissed by mutableStateOf(false)
              private var error by mutableStateOf<String?>(null)
              private var showStreams by mutableStateOf(false)
              private var showQuality by mutableStateOf(false)
              private var offlineTitle by mutableStateOf<String?>(null)
              private var localPath by mutableStateOf<String?>(null)

              private var countdownStart = 0L
              private var skippedIntro = false
              private var session = UUID.randomUUID().toString()
              private var lastReport = 0L
              private var loadJob: Job? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  hideBars()
                  kbps = Plex.prefs.quality

                  val httpFactory = DefaultHttpDataSource.Factory()
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(15_000)
                      .setReadTimeoutMs(30_000)
                      .setDefaultRequestProperties(Plex.headers() - "Accept")
                  player = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(DefaultDataSource.Factory(this, httpFactory)))
                      .setSeekBackIncrementMs(10_000)
                      .setSeekForwardIncrementMs(10_000)
                      .setAudioAttributes(
                          AudioAttributes.Builder().setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MOVIE).build(),
                          true,
                      )
                      .setHandleAudioBecomingNoisy(true)
                      .build()
                  player.addListener(object : Player.Listener {
                      override fun onPlayerError(e: PlaybackException) = handleError(e)
                      override fun onPlaybackStateChanged(state: Int) {
                          if (state == Player.STATE_ENDED) onEnded()
                      }
                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          report(if (isPlaying) "playing" else "paused")
                      }
                  })

                  setContent { FeynosTheme { PlayerUi() } }
                  lifecycleScope.launch { ticker() }
                  begin(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  stopCurrent()
                  begin(intent)
              }

              private fun hideBars() {
                  WindowInsetsControllerCompat(window, window.decorView).let {
                      it.hide(WindowInsetsCompat.Type.systemBars())
                      it.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideBars()
              }

              private fun begin(i: Intent) {
                  val rk = i.getStringExtra("rk")
                  if (rk == null) {
                      finish()
                      return
                  }
                  localPath = i.getStringExtra("local")
                  offlineTitle = Downloads.find(rk)?.let { if (it.subtitle.isNotEmpty()) "${it.title} · ${it.subtitle}" else it.title }
                  val offset = i.getLongExtra("offset", 0L)
                  val autoResume = i.getBooleanExtra("autoResume", false)
                  current = null
                  next = null
                  error = null
                  countdown = -1
                  transcoding = false
                  loadJob?.cancel()
                  loadJob = lifecycleScope.launch {
                      val meta = try {
                          Plex.metadata(rk)
                      } catch (e: Exception) {
                          if (localPath == null) {
                              error = "Couldn't load this title (${e.message})"
                              return@launch
                          }
                          null
                      }
                      if (meta == null && localPath == null) {
                          error = "This title isn't on the server anymore."
                          return@launch
                      }
                      current = meta
                      val start = if (autoResume && offset == 0L) (meta?.viewOffset ?: 0L) else offset
                      startPlayback(start)
                      if (meta != null && meta.type == "episode") next = findNext(meta)
                  }
              }

              private suspend fun findNext(m: Item): Item? {
                  val show = m.grandparentRatingKey ?: return null
                  return runCatching {
                      val leaves = Plex.allLeaves(show)
                      val i = leaves.indexOfFirst { it.ratingKey == m.ratingKey }
                      if (i >= 0) leaves.getOrNull(i + 1) else null
                  }.getOrNull()
              }

              private fun subMime(codec: String?): String? = when (codec?.lowercase()) {
                  "srt", "subrip" -> MimeTypes.APPLICATION_SUBRIP
                  "ass", "ssa" -> MimeTypes.TEXT_SSA
                  "vtt", "webvtt" -> MimeTypes.TEXT_VTT
                  else -> null
              }

              private fun startPlayback(startMs: Long) {
                  val m = current
                  val local = localPath
                  val mediaItem: MediaItem
                  if (local != null) {
                      transcoding = false
                      mediaItem = MediaItem.fromUri(Uri.fromFile(File(local)))
                  } else {
                      if (m == null) return
                      val part = m.media.firstOrNull()?.parts?.firstOrNull()
                      if (part == null || transcoding || kbps > 0) {
                          transcoding = true
                          session = UUID.randomUUID().toString()
                          mediaItem = MediaItem.Builder()
                              .setUri(Plex.transcodeUrl(m.ratingKey, session, if (kbps > 0) kbps else 20000))
                              .setMimeType(MimeTypes.APPLICATION_M3U8)
                              .build()
                      } else {
                          val subs = part.streams.filter { it.type == 3 && it.key != null }.mapNotNull { s ->
                              val mime = subMime(s.codec) ?: return@mapNotNull null
                              MediaItem.SubtitleConfiguration.Builder(Uri.parse(Plex.streamUrl(s.key!!)))
                                  .setMimeType(mime)
                                  .setLanguage(s.language)
                                  .setLabel(s.title)
                                  .setSelectionFlags(if (s.selected) C.SELECTION_FLAG_DEFAULT else 0)
                                  .build()
                          }
                          mediaItem = MediaItem.Builder().setUri(Plex.directUrl(part)).setSubtitleConfigurations(subs).build()
                          val audioLang = part.streams.firstOrNull { it.type == 2 && it.selected }?.language
                          val sub = part.streams.firstOrNull { it.type == 3 && it.selected }
                          player.trackSelectionParameters = player.trackSelectionParameters.buildUpon()
                              .setPreferredAudioLanguage(audioLang)
                              .setPreferredTextLanguage(sub?.language)
                              .build()
                      }
                  }
                  skippedIntro = false
                  creditsDismissed = false
                  countdown = -1
                  error = null
                  player.setMediaItem(mediaItem, startMs)
                  player.prepare()
                  player.playWhenReady = true
              }

              private fun handleError(e: PlaybackException) {
                  if (!transcoding && localPath == null && current != null) {
                      toast("Can't play this file directly — transcoding instead")
                      val pos = player.currentPosition
                      transcoding = true
                      startPlayback(pos)
                  } else {
                      error = "Playback error: ${e.errorCodeName}"
                  }
              }

              private fun onEnded() {
                  report("stopped")
                  if (next != null && Plex.prefs.autoplayNext) playNext() else finish()
              }

              private fun stopCurrent() {
                  report("stopped")
                  if (transcoding) {
                      val s = session
                      Plex.bg.launch { Plex.stopTranscode(s) }
                  }
              }

              private fun playNext() {
                  val n = next ?: return
                  player.pause()
                  stopCurrent()
                  next = null
                  countdown = -1
                  val local = Downloads.find(n.ratingKey)?.takeIf { Downloads.isComplete(this, it) }
                  loadJob?.cancel()
                  loadJob = lifecycleScope.launch {
                      val meta = runCatching { Plex.metadata(n.ratingKey) }.getOrNull() ?: n
                      current = meta
                      localPath = local?.file
                      transcoding = false
                      startPlayback(0)
                      if (meta.type == "episode") next = findNext(meta)
                  }
              }

              private fun restartAt(pos: Long) {
                  if (transcoding) {
                      val s = session
                      Plex.bg.launch { Plex.stopTranscode(s) }
                  }
                  startPlayback(pos)
              }

              private fun report(state: String) {
                  val m = current ?: return
                  lastReport = SystemClock.elapsedRealtime()
                  val pos = player.currentPosition
                  val dur = player.duration.takeIf { it > 0 } ?: m.duration
                  Plex.bg.launch { Plex.timeline(m.ratingKey, state, pos, dur) }
              }

              private fun inCredits(m: Item): Boolean {
                  if (duration <= 0) return false
                  val credits = m.markers.filter { it.type == "credits" }
                  val fin = credits.firstOrNull { it.final } ?: credits.lastOrNull()
                  return if (fin != null) position >= fin.start && position < duration
                  else m.type == "episode" && (duration - position).let { it in 1L..20_000L }
              }

              private suspend fun ticker() {
                  while (true) {
                      delay(500)
                      position = player.currentPosition
                      duration = player.duration.let { if (it == C.TIME_UNSET || it < 0) 0L else it }
                      val m = current ?: continue
                      if (player.isPlaying && SystemClock.elapsedRealtime() - lastReport > 10_000) report("playing")

                      val intro = m.markers.firstOrNull { it.type == "intro" && position >= it.start && position < it.end }
                      if (intro != null && Plex.prefs.autoSkipIntro && !skippedIntro) {
                          skippedIntro = true
                          player.seekTo(intro.end)
                      }

                      if (next != null && Plex.prefs.autoplayNext && !creditsDismissed && inCredits(m)) {
                          if (countdown < 0) {
                              countdown = 10
                              countdownStart = SystemClock.elapsedRealtime()
                          } else {
                              if (!player.isPlaying) countdownStart += 500
                              val left = 10 - ((SystemClock.elapsedRealtime() - countdownStart) / 1000).toInt()
                              countdown = left.coerceAtLeast(0)
                              if (left <= 0) playNext()
                          }
                      } else if (countdown >= 0) {
                          countdown = -1
                      }
                  }
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (player.isPlaying) {
                      runCatching {
                          enterPictureInPictureMode(PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build())
                      }
                  }
              }

              override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  inPip = isInPictureInPictureMode
              }

              override fun onStop() {
                  super.onStop()
                  player.pause()
              }

              override fun onDestroy() {
                  stopCurrent()
                  player.release()
                  super.onDestroy()
              }

              // ---------------------------------------------------------------- UI

              @Composable
              private fun PlayerUi() {
                  Box(Modifier.fillMaxSize().background(Color.Black)) {
                      AndroidView(
                          factory = { c ->
                              PlayerView(c).apply {
                                  player = this@PlayerActivity.player
                                  setShowSubtitleButton(true)
                                  setShowNextButton(false)
                                  setShowPreviousButton(false)
                                  controllerShowTimeoutMs = 3500
                                  setControllerVisibilityListener(
                                      PlayerView.ControllerVisibilityListener { v -> controlsVisible = v == View.VISIBLE }
                                  )
                              }
                          },
                          update = { v -> v.useController = !inPip },
                          modifier = Modifier.fillMaxSize(),
                      )

                      if (!inPip) {
                          val m = current
                          val err = error
                          if (err != null) {
                              Column(
                                  Modifier.align(Alignment.Center).clip(RoundedCornerShape(12.dp)).background(Color(0xE6141414)).padding(24.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                              ) {
                                  Text(err, color = Color.White)
                                  Spacer(Modifier.height(12.dp))
                                  Row {
                                      if (localPath == null && current != null) {
                                          Button(onClick = {
                                              transcoding = true
                                              startPlayback(position)
                                          }) { Text("Try transcoding") }
                                          Spacer(Modifier.width(8.dp))
                                      }
                                      TextButton(onClick = { finish() }) { Text("Close") }
                                  }
                              }
                          } else if (m == null && localPath == null) {
                              CircularProgressIndicator(Modifier.align(Alignment.Center), color = Accent)
                          }

                          if (controlsVisible || err != null) TopBar(m)

                          Column(
                              Modifier.align(Alignment.BottomEnd).padding(end = 28.dp, bottom = 96.dp),
                              horizontalAlignment = Alignment.End,
                          ) {
                              val intro = m?.markers?.firstOrNull { it.type == "intro" && position >= it.start && position < it.end }
                              if (intro != null) {
                                  OutlinedButton(
                                      onClick = { player.seekTo(intro.end) },
                                      colors = ButtonDefaults.outlinedButtonColors(containerColor = Color(0xCC000000), contentColor = Color.White),
                                  ) { Text("Skip Intro", fontWeight = FontWeight.Bold) }
                              }
                              val n = next
                              if (m != null && n != null && inCredits(m)) {
                                  if (countdown >= 0) {
                                      Column(
                                          Modifier.width(300.dp).clip(RoundedCornerShape(10.dp)).background(Color(0xE6141414)).padding(14.dp)
                                      ) {
                                          Text("Next episode in $countdown", color = Muted, fontSize = 12.sp)
                                          Text(
                                              "${n.epLabel} · ${n.title}",
                                              color = Color.White,
                                              fontWeight = FontWeight.Bold,
                                              maxLines = 1,
                                              overflow = TextOverflow.Ellipsis,
                                          )
                                          Spacer(Modifier.height(10.dp))
                                          Row {
                                              Button(
                                                  onClick = { playNext() },
                                                  colors = ButtonDefaults.buttonColors(containerColor = Color.White, contentColor = Color.Black),
                                              ) {
                                                  Icon(Icons.Default.PlayArrow, null)
                                                  Text("Play now")
                                              }
                                              Spacer(Modifier.width(8.dp))
                                              TextButton(onClick = {
                                                  creditsDismissed = true
                                                  countdown = -1
                                              }) { Text("Watch credits", color = Color.White) }
                                          }
                                      }
                                  } else {
                                      Button(
                                          onClick = { playNext() },
                                          colors = ButtonDefaults.buttonColors(containerColor = Color.White, contentColor = Color.Black),
                                      ) {
                                          Icon(Icons.Default.SkipNext, null)
                                          Spacer(Modifier.width(4.dp))
                                          Text("Next Episode", fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                      }
                  }

                  if (showQuality) QualityDialog()
                  if (showStreams) StreamsDialog()
              }

              @Composable
              private fun TopBar(m: Item?) {
                  Row(
                      Modifier.fillMaxWidth()
                          .background(Brush.verticalGradient(listOf(Color(0xB0000000), Color.Transparent)))
                          .padding(horizontal = 12.dp, vertical = 10.dp),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      IconButton(onClick = { finish() }) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "Back", tint = Color.White) }
                      Column(Modifier.weight(1f)) {
                          Text(m?.heading ?: offlineTitle ?: "", color = Color.White, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          if (m != null && m.type == "episode") Text("${m.epLabel} · ${m.title}", color = Muted, maxLines = 1, fontSize = 13.sp)
                          val mode = when {
                              localPath != null -> "Downloaded"
                              transcoding -> "Transcoding · " + Plex.qualityLabel(if (kbps > 0) kbps else 20000)
                              else -> "Direct play"
                          }
                          Text(mode, color = Muted, fontSize = 11.sp)
                      }
                      if (localPath == null && m != null) {
                          IconButton(onClick = { showQuality = true }) { Icon(Icons.Default.HighQuality, "Quality", tint = Color.White) }
                          if (transcoding) IconButton(onClick = { showStreams = true }) { Icon(Icons.Default.Subtitles, "Audio & subtitles", tint = Color.White) }
                      }
                      if (next != null) IconButton(onClick = { playNext() }) { Icon(Icons.Default.SkipNext, "Next episode", tint = Color.White) }
                  }
              }

              @Composable
              private fun QualityDialog() {
                  AlertDialog(
                      onDismissRequest = { showQuality = false },
                      title = { Text("Quality") },
                      text = {
                          Column {
                              Plex.QUALITIES.forEach { (q, label) ->
                                  Row(
                                      Modifier.fillMaxWidth().clickable {
                                          showQuality = false
                                          if (q != kbps || (q == 0 && transcoding)) {
                                              val pos = player.currentPosition
                                              val wasTranscoding = transcoding
                                              if (wasTranscoding) {
                                                  val s = session
                                                  Plex.bg.launch { Plex.stopTranscode(s) }
                                              }
                                              kbps = q
                                              transcoding = q > 0
                                              startPlayback(pos)
                                          }
                                      }.padding(vertical = 4.dp),
                                      verticalAlignment = Alignment.CenterVertically,
                                  ) {
                                      RadioButton(selected = kbps == q, onClick = null)
                                      Spacer(Modifier.width(8.dp))
                                      Text(label)
                                  }
                              }
                          }
                      },
                      confirmButton = { TextButton(onClick = { showQuality = false }) { Text("Close") } },
                  )
              }

              @Composable
              private fun StreamsDialog() {
                  val m = current
                  val part = m?.media?.firstOrNull()?.parts?.firstOrNull()
                  if (m == null || part == null) {
                      showStreams = false
                      return
                  }
                  val audio = part.streams.filter { it.type == 2 }
                  val subs = part.streams.filter { it.type == 3 }
                  fun choose(a: Long?, s: Long?) {
                      showStreams = false
                      val pos = player.currentPosition
                      lifecycleScope.launch {
                          runCatching { Plex.setStreams(part.id, a, s) }
                          current = runCatching { Plex.metadata(m.ratingKey) }.getOrNull() ?: m
                          restartAt(pos)
                      }
                  }
                  AlertDialog(
                      onDismissRequest = { showStreams = false },
                      title = { Text("Audio & Subtitles") },
                      text = {
                          LazyColumn(Modifier.heightIn(max = 420.dp)) {
                              item { Text("AUDIO", color = Accent, fontSize = 12.sp, fontWeight = FontWeight.Bold) }
                              items(audio) { s -> StreamRow(s.title, s.selected) { choose(s.id, null) } }
                              item { Text("SUBTITLES", color = Accent, fontSize = 12.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 12.dp)) }
                              item { StreamRow("Off", subs.none { it.selected }) { choose(null, 0L) } }
                              items(subs) { s -> StreamRow(s.title, s.selected) { choose(null, s.id) } }
                          }
                      },
                      confirmButton = { TextButton(onClick = { showStreams = false }) { Text("Close") } },
                  )
              }

              @Composable
              private fun StreamRow(label: String, selected: Boolean, onClick: () -> Unit) {
                  Row(
                      Modifier.fillMaxWidth().clickable(onClick = onClick).padding(vertical = 4.dp),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      RadioButton(selected = selected, onClick = null)
                      Spacer(Modifier.width(8.dp))
                      Text(label, maxLines = 2, overflow = TextOverflow.Ellipsis)
                  }
              }
          }
