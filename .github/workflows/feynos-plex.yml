                                      when {
                                          done -> Text(fmtDuration(d.duration).ifEmpty { "Ready" }, color = Muted, style = MaterialTheme.typography.bodySmall)
                                          failed -> Text("Download failed", color = Danger, style = MaterialTheme.typography.bodySmall)
                                          else -> {
                                              Text("Downloading ${(st.progress * 100).toInt()}%", color = Accent, style = MaterialTheme.typography.bodySmall)
                                              LinearProgressIndicator(
                                                  progress = { st.progress },
                                                  modifier = Modifier.fillMaxWidth().padding(top = 4.dp),
