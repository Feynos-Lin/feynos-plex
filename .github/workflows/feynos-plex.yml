name: Build Feynos Plex

# This one file IS the whole app: it writes the Android project, builds a signed APK,
# and publishes it as a GitHub release (which the app checks for updates).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Write project
        run: |
          set -e
          mkdir -p "app"
          cat > "app/build.gradle.kts" <<'FEYNOS_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          val buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
          val repoName = System.getenv("GITHUB_REPOSITORY") ?: ""

          android {
              namespace = "com.feynos.plex"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.feynos.plex"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = buildNumber
                  versionName = "1.0.$buildNumber"
                  buildConfigField("String", "REPO", "\"$repoName\"")
              }

              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("release.jks")
                      storePassword = System.getenv("KS_PASS") ?: "feynosplex"
                      keyAlias = System.getenv("KS_ALIAS") ?: "feynos"
                      keyPassword = System.getenv("KS_PASS") ?: "feynosplex"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              packaging {
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
              }
          }

          dependencies {
              val media3 = "1.5.1"
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.navigation:navigation-compose:2.8.5")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-exoplayer-hls:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          FEYNOS_EOF

          mkdir -p "app"
          cat > "app/proguard-rules.pro" <<'FEYNOS_EOF'
          -dontwarn org.conscrypt.**
          -dontwarn org.bouncycastle.**
          -dontwarn org.openjsse.**
          -dontwarn okhttp3.internal.platform.**
          -keep class com.feynos.plex.BuildConfig { *; }
          FEYNOS_EOF

          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:name=".FeynosApp"
                  android:label="Feynos Plex"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:supportsPictureInPicture="true"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          FEYNOS_EOF

          mkdir -p "app/src/main/java/com/feynos/plex"
          cat > "app/src/main/java/com/feynos/plex/Components.kt" <<'FEYNOS_EOF'
          @file:OptIn(ExperimentalMaterial3Api::class, ExperimentalFoundationApi::class)

          package com.feynos.plex

          import android.content.Context
          import android.content.Intent
          import android.widget.Toast
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBack
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.compose.LifecycleResumeEffect
          import androidx.navigation.NavController
          import coil.compose.AsyncImage
          import kotlinx.coroutines.launch

          val Accent = Color(0xFFE5A00D)
          val Bg = Color(0xFF0A0A0A)
          val Muted = Color(0xFFB3B3B3)
          val Danger = Color(0xFFFF6B6B)

          @Composable
          fun FeynosTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Accent,
                      onPrimary = Color.Black,
                      secondary = Accent,
                      onSecondary = Color.Black,
                      background = Bg,
                      onBackground = Color.White,
                      surface = Color(0xFF161616),
                      onSurface = Color.White,
                      surfaceVariant = Color(0xFF262626),
                      onSurfaceVariant = Muted,
                      surfaceContainer = Color(0xFF1C1C1C),
                      surfaceContainerHigh = Color(0xFF242424),
                      surfaceContainerHighest = Color(0xFF2C2C2C),
                  ),
                  content = content,
              )
          }

          /** Runs [block] every time the screen comes back to the foreground. */
          @Composable
          fun OnResume(block: () -> Unit) {
              LifecycleResumeEffect(Unit) {
                  block()
                  onPauseOrDispose { }
              }
          }

          @Composable
          fun Logo(size: Int = 34) {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Box(
                      Modifier.size(size.dp).clip(RoundedCornerShape(8.dp)).background(Accent),
                      contentAlignment = Alignment.Center,
                  ) {
                      Text("F", color = Color.Black, fontWeight = FontWeight.Black, fontSize = (size * 0.6f).sp)
                  }
                  Spacer(Modifier.width(10.dp))
                  Text("Feynos Plex", fontWeight = FontWeight.Bold, fontSize = (size * 0.6f).sp, color = Color.White)
              }
          }

          @Composable
          fun PlexImage(path: String?, w: Int, h: Int, modifier: Modifier = Modifier, scale: ContentScale = ContentScale.Crop) {
              AsyncImage(
                  model = Plex.img(path, w, h),
                  contentDescription = null,
                  contentScale = scale,
                  modifier = modifier.background(Color(0xFF1F1F1F)),
              )
          }

          @Composable
          fun ProgressStrip(p: Float, modifier: Modifier = Modifier) {
              Box(modifier.fillMaxWidth().height(3.dp).background(Color(0x55FFFFFF))) {
                  Box(Modifier.fillMaxHeight().fillMaxWidth(p.coerceIn(0f, 1f)).background(Accent))
              }
          }

          @Composable
          fun PosterCard(
              item: Item,
              modifier: Modifier = Modifier.width(112.dp),
              showTitle: Boolean = false,
              onLongClick: (() -> Unit)? = null,
              onClick: () -> Unit,
          ) {
              Column(modifier) {
                  Box(
                      Modifier.fillMaxWidth().aspectRatio(2f / 3f).clip(RoundedCornerShape(6.dp))
                          .combinedClickable(onClick = onClick, onLongClick = onLongClick)
                  ) {
                      PlexImage(item.poster, 300, 450, Modifier.fillMaxSize())
                      val unwatched = item.leafCount - item.viewedLeafCount
                      if (item.isWatched) {
                          Box(
                              Modifier.align(Alignment.TopEnd).padding(5.dp).size(20.dp).clip(CircleShape).background(Accent),
                              contentAlignment = Alignment.Center,
                          ) { Icon(Icons.Default.Check, null, tint = Color.Black, modifier = Modifier.size(14.dp)) }
                      } else if ((item.type == "show" || item.type == "season") && unwatched > 0) {
                          Box(
                              Modifier.align(Alignment.TopEnd).padding(5.dp).clip(RoundedCornerShape(4.dp)).background(Accent)
                                  .padding(horizontal = 5.dp, vertical = 1.dp)
                          ) { Text("$unwatched", color = Color.Black, fontSize = 11.sp, fontWeight = FontWeight.Bold) }
                      }
                      if (item.progress > 0f) ProgressStrip(item.progress, Modifier.align(Alignment.BottomCenter))
                  }
                  if (showTitle) {
                      Text(
                          item.heading,
                          style = MaterialTheme.typography.bodySmall,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                          modifier = Modifier.padding(top = 4.dp),
                      )
                      if (item.year > 0 && item.type != "episode") Text("${item.year}", style = MaterialTheme.typography.labelSmall, color = Muted)
                  }
              }
          }

          @Composable
          fun WideCard(item: Item, modifier: Modifier = Modifier.width(232.dp), onLongClick: (() -> Unit)? = null, onClick: () -> Unit) {
              Column(modifier.clip(RoundedCornerShape(6.dp)).combinedClickable(onClick = onClick, onLongClick = onLongClick)) {
                  Box(Modifier.fillMaxWidth().aspectRatio(16f / 9f)) {
                      PlexImage(item.wideImage, 480, 270, Modifier.fillMaxSize())
                      Box(
                          Modifier.align(Alignment.Center).size(42.dp).clip(CircleShape).background(Color(0x99000000))
                              .border(1.5.dp, Color.White, CircleShape),
                          contentAlignment = Alignment.Center,
                      ) { Icon(Icons.Default.PlayArrow, null, tint = Color.White) }
                      if (item.progress > 0f) ProgressStrip(item.progress, Modifier.align(Alignment.BottomCenter))
                  }
                  Column(Modifier.fillMaxWidth().background(Color(0xFF1A1A1A)).padding(horizontal = 8.dp, vertical = 6.dp)) {
                      Text(item.heading, style = MaterialTheme.typography.bodyMedium, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      val sub = item.subheading.ifEmpty { fmtDuration(item.duration) }
                      Text(sub, style = MaterialTheme.typography.bodySmall, color = Muted, maxLines = 1, overflow = TextOverflow.Ellipsis)
                  }
              }
          }

          @Composable
          fun HubRow(hub: Hub, nav: NavController) {
              val ctx = LocalContext.current
              val wide = hub.isContinue || hub.type == "episode"
              Column(Modifier.padding(top = 16.dp)) {
                  Text(
                      hub.title,
                      style = MaterialTheme.typography.titleMedium,
                      fontWeight = FontWeight.Bold,
                      modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp),
                  )
                  LazyRow(contentPadding = PaddingValues(horizontal = 16.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(hub.items) { x ->
                          if (wide) {
                              WideCard(x, onLongClick = { nav.openItem(x) }) {
                                  if (hub.isContinue && x.playable) ctx.play(x, resume = true) else nav.openItem(x)
                              }
                          } else {
                              PosterCard(x) { nav.openItem(x) }
                          }
                      }
                  }
              }
          }

          @Composable
          fun ScreenTitle(title: String, onBack: (() -> Unit)? = null, actions: @Composable RowScope.() -> Unit = {}) {
              Row(
                  Modifier.fillMaxWidth().statusBarsPadding().padding(horizontal = 4.dp, vertical = 6.dp).height(48.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  if (onBack != null) {
                      IconButton(onClick = onBack) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "Back") }
                  } else {
                      Spacer(Modifier.width(12.dp))
                  }
                  Text(
                      title,
                      style = MaterialTheme.typography.titleLarge,
                      fontWeight = FontWeight.Bold,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                      modifier = Modifier.weight(1f),
                  )
                  actions()
              }
          }

          @Composable
          fun Loading() {
              Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator(color = Accent) }
          }

          @Composable
          fun Message(text: String, actions: @Composable ColumnScope.() -> Unit = {}) {
              Column(
                  Modifier.fillMaxSize().padding(32.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center,
              ) {
                  Text(text, color = Muted, textAlign = TextAlign.Center)
                  Spacer(Modifier.height(12.dp))
                  actions()
              }
          }

          @Composable
          fun PillButton(text: String, onClick: () -> Unit) {
              Box(
                  Modifier.clip(RoundedCornerShape(50)).border(1.dp, Color(0x99FFFFFF), RoundedCornerShape(50))
                      .clickable(onClick = onClick).padding(horizontal = 14.dp, vertical = 6.dp)
              ) { Text(text, style = MaterialTheme.typography.labelLarge, color = Color.White) }
          }

          @Composable
          fun ActionIcon(icon: ImageVector, label: String, tint: Color = Color.White, onClick: () -> Unit) {
              Column(
                  Modifier.clip(RoundedCornerShape(8.dp)).clickable(onClick = onClick).padding(horizontal = 12.dp, vertical = 6.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
              ) {
                  Icon(icon, null, tint = tint)
                  Spacer(Modifier.height(2.dp))
                  Text(label, style = MaterialTheme.typography.labelSmall, color = Muted)
              }
          }

          @Composable
          fun DownloadIcon(item: Item) {
              val ctx = LocalContext.current
              val d = Downloads.list.firstOrNull { it.rk == item.ratingKey }
              IconButton(onClick = {
                  if (d == null) {
                      if (Downloads.start(ctx, item)) ctx.toast("Downloading ${item.title}") else ctx.toast("Can't download this")
                  } else ctx.toast("Already in Downloads")
              }) {
                  Icon(
                      if (d == null) Icons.Default.Download else Icons.Default.DownloadDone,
                      "Download",
                      tint = if (d == null) Color.White else Accent,
                  )
              }
          }

          @Composable
          fun UpdateDialog(r: Updater.Release, onDismiss: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var progress by remember { mutableStateOf<Float?>(null) }
              var err by remember { mutableStateOf<String?>(null) }
              AlertDialog(
                  onDismissRequest = { if (progress == null) onDismiss() },
                  title = { Text("Update available") },
                  text = {
                      Column(Modifier.verticalScroll(rememberScrollState())) {
                          Text(r.name, fontWeight = FontWeight.Bold)
                          if (r.notes.isNotBlank()) Text(r.notes, color = Muted, modifier = Modifier.padding(top = 8.dp))
                          progress?.let { p ->
                              LinearProgressIndicator(progress = { p }, modifier = Modifier.fillMaxWidth().padding(top = 12.dp), color = Accent)
                          }
                          err?.let { Text(it, color = Danger, modifier = Modifier.padding(top = 8.dp)) }
                      }
                  },
                  confirmButton = {
                      TextButton(enabled = progress == null, onClick = {
                          progress = 0f
                          err = null
                          scope.launch {
                              try {
                                  val f = Updater.download(r) { p -> progress = p }
                                  progress = null
                                  Updater.install(ctx, f)
                                  onDismiss()
                              } catch (e: Exception) {
                                  err = e.message ?: "Update failed"
                                  progress = null
                              }
                          }
                      }) { Text("Update") }
                  },
                  dismissButton = { TextButton(enabled = progress == null, onClick = onDismiss) { Text("Later") } },
              )
          }

          fun Context.toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()

          fun NavController.openItem(item: Item) {
              val rk = when (item.type) {
                  "episode" -> item.grandparentRatingKey ?: item.ratingKey
                  "season" -> item.parentRatingKey ?: item.ratingKey
                  else -> item.ratingKey
              }
              navigate("detail/$rk")
          }

          fun Context.play(item: Item, resume: Boolean) {
              val local = Downloads.find(item.ratingKey)?.takeIf { Downloads.isComplete(this, it) }
              val i = Intent(this, PlayerActivity::class.java)
                  .putExtra("rk", item.ratingKey)
                  .putExtra("offset", if (resume) item.viewOffset else 0L)
              if (local != null) i.putExtra("local", local.file)
              startActivity(i)
          }

          fun fmtDuration(ms: Long): String {
              if (ms <= 0) return ""
              val m = ms / 60000
              return if (m >= 60) "${m / 60}h ${m % 60}m" else "${m}m"
          }
          FEYNOS_EOF

          mkdir -p "app/src/main/java/com/feynos/plex"
          cat > "app/src/main/java/com/feynos/plex/Detail.kt" <<'FEYNOS_EOF'
          @file:OptIn(ExperimentalMaterial3Api::class)

          package com.feynos.plex

          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBack
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.runtime.saveable.rememberSaveable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.navigation.NavController
          import coil.compose.AsyncImage
          import kotlinx.coroutines.launch

          @Composable
          fun DetailScreen(nav: NavController, rk: String) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var meta by remember { mutableStateOf<Item?>(null) }
              var error by remember { mutableStateOf<String?>(null) }
              var seasons by remember { mutableStateOf<List<Item>>(emptyList()) }
              var seasonKey by rememberSaveable { mutableStateOf<String?>(null) }
              var episodes by remember { mutableStateOf<List<Item>>(emptyList()) }
              var episodesFor by remember { mutableStateOf<String?>(null) }
              var reload by remember { mutableIntStateOf(0) }
              var expanded by remember { mutableStateOf(false) }
              var seasonMenu by remember { mutableStateOf(false) }

              OnResume { reload++ }

              LaunchedEffect(rk, reload) {
                  try {
                      val m = Plex.metadata(rk) ?: throw Exception("Not found on server")
                      meta = m
                      error = null
                      if (m.type == "show") {
                          val s = Plex.children(rk)
                          seasons = s
                          val cur = seasonKey
                          if (cur == null || s.none { it.ratingKey == cur }) {
                              seasonKey = (s.firstOrNull { it.ratingKey == m.onDeck?.parentRatingKey }
                                  ?: s.firstOrNull { it.index > 0 } ?: s.firstOrNull())?.ratingKey
                          }
                      }
                  } catch (e: Exception) {
                      if (meta == null) error = e.message ?: "Couldn't load"
                  }
              }

              LaunchedEffect(seasonKey, reload) {
                  val k = seasonKey ?: return@LaunchedEffect
                  if (episodesFor != k) episodes = emptyList()
                  runCatching { Plex.children(k) }.onSuccess {
                      episodes = it
                      episodesFor = k
                  }
              }

              val m = meta
              if (m == null) {
                  val err = error
                  if (err != null) {
                      Message("Couldn't open this title.\n$err") {
                          Button(onClick = { reload++ }) { Text("Retry") }
                          TextButton(onClick = { nav.popBackStack() }) { Text("Back") }
                      }
                  } else Loading()
                  return
              }

              val trailer = m.extras.firstOrNull { it.subtype == "trailer" } ?: m.extras.firstOrNull()
              val target: Item? = when (m.type) {
                  "show" -> m.onDeck ?: episodes.firstOrNull()
                  "season" -> null
                  else -> m
              }
              val resume = target != null && target.viewOffset > 60_000 && target.progress < 0.95f
              val playLabel = when {
                  target == null -> "Play"
                  m.type == "show" -> (if (resume) "Resume " else "Play ") + target.epLabel
                  resume -> "Resume"
                  else -> "Play"
              }

              LazyColumn(Modifier.fillMaxSize()) {
                  item {
                      Box(Modifier.fillMaxWidth().aspectRatio(16f / 10f)) {
                          PlexImage(m.backdrop, 1280, 800, Modifier.fillMaxSize())
                          Box(
                              Modifier.fillMaxSize().background(
                                  Brush.verticalGradient(0f to Color(0x99000000), 0.3f to Color.Transparent, 1f to Bg)
                              )
                          )
                          IconButton(
                              onClick = { nav.popBackStack() },
                              modifier = Modifier.statusBarsPadding().padding(6.dp).clip(CircleShape).background(Color(0x66000000)),
                          ) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "Back", tint = Color.White) }
                          if (trailer != null) {
                              IconButton(
                                  onClick = { ctx.play(trailer, false) },
                                  modifier = Modifier.align(Alignment.Center).size(64.dp).clip(CircleShape).background(Color(0x66000000)),
                              ) { Icon(Icons.Default.PlayArrow, "Play trailer", Modifier.size(40.dp), tint = Color.White) }
                          }
                      }
                  }

                  item {
                      Column(Modifier.padding(horizontal = 16.dp)) {
                          Text(m.heading, style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)
                          if (m.type == "episode") Text("${m.epLabel} · ${m.title}", style = MaterialTheme.typography.titleMedium)
                          MetaRow(m, if (seasons.isNotEmpty()) seasons.size else m.childCount)
                          Spacer(Modifier.height(14.dp))

                          if (target != null) {
                              Button(
